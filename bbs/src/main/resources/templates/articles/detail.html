<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('게시글 상세')}"></head>
<body class="bg-slate-950 text-slate-100 min-h-screen"><header th:replace="~{fragments/layout :: header}"></header>
<main class="max-w-3xl mx-auto px-4 py-8"><article class="bg-slate-900 border border-slate-800 rounded-xl shadow p-6"><h1 class="text-3xl font-bold" th:text="${article.title}"></h1><div class="text-sm text-slate-400 mt-3 pb-4 border-b border-slate-700"><span th:text="${article.author.name}"></span> · <span th:text="${#temporals.format(article.createdAt, 'yyyy-MM-dd HH:mm')}"></span></div><div class="whitespace-pre-line py-8 min-h-48 text-slate-200" th:text="${article.content}"></div><div class="flex gap-2"><a th:href="@{/articles}" class="border border-slate-700 rounded-lg px-4 py-2 hover:bg-slate-800">목록</a><span th:if="${currentUsername != null and currentUsername == article.author.username}" class="flex gap-2"><a th:href="@{/articles/{id}/edit(id=${article.id})}" class="bg-blue-600 hover:bg-blue-700 text-white rounded-lg px-4 py-2">수정</a><form th:action="@{/articles/{id}/delete(id=${article.id})}" method="post" onsubmit="return confirm('삭제하시겠습니까?');"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="bg-red-600 hover:bg-red-700 text-white rounded-lg px-4 py-2">삭제</button></form></span></div></article></main></body></html>
