<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${articleId == null ? '게시글 등록' : '게시글 수정'})}"></head>
<body class="bg-slate-950 text-slate-100 min-h-screen"><header th:replace="~{fragments/layout :: header}"></header>
<main class="max-w-3xl mx-auto px-4 py-8"><section class="bg-slate-900 border border-slate-800 rounded-xl shadow p-6"><h1 class="text-2xl font-bold mb-6" th:text="${articleId == null ? '게시글 등록' : '게시글 수정'}"></h1><form th:object="${articleForm}" th:action="${articleId == null ? '/articles' : '/articles/' + articleId + '/edit'}" method="post" class="space-y-5"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><div><label class="block mb-1">제목</label><input th:field="*{title}" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500"><p th:errors="*{title}" class="text-red-400 text-sm mt-1"></p></div><div><label class="block mb-1">내용</label><textarea th:field="*{content}" rows="12" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea><p th:errors="*{content}" class="text-red-400 text-sm mt-1"></p></div><div class="flex gap-2"><a th:href="@{/articles}" class="border border-slate-700 rounded-lg px-4 py-2 hover:bg-slate-800">취소</a><button class="bg-blue-600 hover:bg-blue-700 text-white rounded-lg px-4 py-2">저장</button></div></form></section></main></body></html>
