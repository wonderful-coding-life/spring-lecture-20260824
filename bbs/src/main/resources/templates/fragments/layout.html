<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' - 게시판'">게시판</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<header th:fragment="header" class="bg-slate-900 border-b border-slate-800">
    <div class="max-w-5xl mx-auto px-4 py-4 flex flex-wrap items-center justify-between gap-3">
        <a th:href="@{/articles}" class="text-xl font-bold text-slate-100">게시판</a>
        <nav class="flex items-center gap-4 text-sm text-slate-300">
            <span sec:authorize="isAuthenticated()" sec:authentication="principal.displayName" class="text-slate-200"></span>
            <a sec:authorize="isAnonymous()" th:href="@{/login}" class="text-blue-400 hover:text-blue-300">로그인</a>
            <a sec:authorize="isAnonymous()" th:href="@{/members/new}" class="text-blue-400 hover:text-blue-300">회원가입</a>
            <a sec:authorize="isAuthenticated()" th:href="@{/articles/new}" class="text-blue-400 hover:text-blue-300">글쓰기</a>
            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="text-slate-300 hover:text-white">로그아웃</button></form>
        </nav>
    </div>
</header>
</body>
</html>
